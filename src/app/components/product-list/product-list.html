<div class="container mt-4">
  <h2 class="mb-4">List of Products</h2>
  
  <div class="row">
    @for (product of products; track product.id) {
      <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
          <img [src]="product.imageUrl || 'https://via.placeholder.com/150'" 
               class="card-img-top" 
               alt="{{ product.name }}"
               style="height: 200px; object-fit: cover;">
          
          <div class="card-body d-flex flex-column">
            <h5 class="card-title text-primary mb-3">{{ product.name }}</h5>
            <p class="card-text mb-4">{{ product.description }}</p>
            
            <div class="mt-auto">
              <span class="price-badge">$ {{ product.price }}</span>
            </div>
          </div>
        </div>
      </div>
    } @empty {
      <p>Fetching products from AWS...</p>
    }
  </div>
</div>
